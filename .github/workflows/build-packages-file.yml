name: build-packages-file

on:
  workflow_dispatch:
  schedule:
    - cron: "25,55 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.ANONYMOUS_PAT }}
    steps:

    - uses: actions/checkout@v4

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        needs: build

    - name: Install roregistry from the checkout
      run: R CMD INSTALL .

    - name: Build packages.json
      run: |
        roregistry::build_ropensci_packages_json()
      shell: Rscript {0}

    - name: push
      if: success() && github.ref_name == github.event.repository.default_branch
      run: |
        echo "pushing changes to github"
        git config --global user.email "accounts+ropenscibot@ropensci.org"
        git config --global user.name "ropenscibot"
        git add packages.json
        git commit -m 'packages.json updated' || exit 0
        git pull --rebase
        git push
